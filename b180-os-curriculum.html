<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B180 · OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; display:flex; align-items:center; justify-content:center; min-height:100vh;
    background: #E7E5DC; font-family:'Noto Sans KR', sans-serif; padding: 24px;
  }
  #root {
    --paper:#F3F4EE; --ink:#171B17; --ink-soft:#5B6058; --line:#DADBD0;
    --moss:#3F5B4E; --moss-soft:#E4EAE3;
    --amber:#B5792A; --amber-soft:#F1E4CD;
    --rust:#A6553A; --rust-soft:#F1DFD7;
    --slate:#47617A; --slate-soft:#DFE6EB;
    --surface:#FFFFFF;
    --role-accent: var(--moss); --role-accent-soft: var(--moss-soft);
    background: var(--paper); color: var(--ink); width:100%; max-width: 980px;
    min-height: 680px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
  }
  .disp { font-family:'Noto Serif KR', serif; }
  .mono { font-family:'JetBrains Mono', monospace; }

  /* ===== 게이트 ===== */
  .gate { padding: 56px 40px; display:flex; flex-direction:column; align-items:center; gap:36px; }
  .gate-mark { display:flex; align-items:center; gap:10px; }
  .gate-mark .dot { width:8px; height:8px; border-radius:50%; background: var(--moss); }
  .gate-mark span.wordmark { font-family:'Noto Serif KR', serif; font-weight:700; font-size:22px; letter-spacing:.02em; }
  .gate-sub { color: var(--ink-soft); font-size:14px; text-align:center; max-width:420px; line-height:1.6; margin:0; }
  .gate-grid { display:grid; grid-template-columns: repeat(2, minmax(180px,1fr)); gap:14px; width:100%; max-width:620px; }
  .login-card { width:100%; max-width:340px; background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px; display:flex; flex-direction:column; gap:4px; }
  .login-role { display:flex; align-items:center; gap:10px; font-family:'Noto Serif KR', serif; font-weight:700; font-size:16px; margin:6px 0 14px; }
  .login-role .role-icon { width:32px; height:32px; border-radius:9px; background: var(--tile-soft); color: var(--tile-accent); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .login-label { font-size:11.5px; font-weight:700; color: var(--ink-soft); display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .login-input { padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; font-weight:400; color: var(--ink); }
  .login-input:focus { outline:none; border-color: var(--tile-accent); }
  .login-error { font-size:11.5px; color: var(--rust); margin:-4px 0 10px; }
  .att-row { display:flex; gap:10px; flex-wrap:wrap; }
  .att-item { display:flex; flex-direction:column; align-items:center; gap:4px; background: var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px 12px; min-width:66px; }
  .att-dot { width:10px; height:10px; border-radius:50%; }
  .att-label { font-size:10px; color: var(--ink-soft); }
  .att-status { font-size:10.5px; font-weight:700; }
  .msc-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; background: var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:9px 12px; }
  .msc-cat { font-size:10.5px; font-weight:700; width:76px; flex-shrink:0; }
  .msc-type { font-size:12.5px; font-weight:700; color: var(--ink); }
  .msc-desc { font-size:11px; color: var(--ink-soft); flex:1; min-width:140px; }
  .role-tile { background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px;
    text-align:left; cursor:pointer; transition: transform .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:10px; font-family:inherit; }
  .role-tile:hover { transform: translateY(-2px); border-color: var(--tile-accent); }
  .role-icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background: var(--tile-soft); color: var(--tile-accent); font-size:16px; }
  .role-tile .r-label { font-family:'Noto Serif KR', serif; font-weight:700; font-size:16px; }
  .role-tile .r-sub { font-size:12.5px; color: var(--ink-soft); line-height:1.5; }

  /* ===== 셸 ===== */
  .shell { display:flex; height:680px; }
  .dock { width:220px; background: var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 14px; }
  .back-btn { display:flex; align-items:center; gap:6px; font-size:12px; color: var(--ink-soft); background:none; border:none;
    cursor:pointer; padding:2px 6px 14px; text-align:left; font-family:inherit; }
  .back-btn:hover { color: var(--ink); }
  .role-badge { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; background: var(--role-accent-soft); margin-bottom:16px; }
  .role-badge .role-icon { width:26px; height:26px; border-radius:7px; }
  .role-badge .rb-label { font-size:13px; font-weight:700; color: var(--role-accent); }
  .nav-list { display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none; background:none;
    font-size:13.5px; color: var(--ink-soft); cursor:pointer; text-align:left; width:100%; font-family:inherit; }
  .nav-item:hover { background: var(--paper); color: var(--ink); }
  .nav-item.active { background: var(--role-accent-soft); color: var(--role-accent); font-weight:700; }
  .dock-foot { padding-top:10px; border-top:1px solid var(--line); margin-top:10px; }
  .root-caption { font-size:10.5px; color: var(--ink-soft); text-align:center; margin-top:2px; }
  .root-mark { width:100%; height:44px; }
  .root-trunk { stroke: var(--line); stroke-width:2; }
  .root-branch { stroke: var(--line); stroke-width:2; fill:none; }
  .root-branch.on { stroke: var(--role-accent); }

  .canvas-wrap { flex:1; display:flex; flex-direction:column; min-width:0; }
  .canvas-top { height:48px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:12px; color: var(--ink-soft); }
  .session-banner { display:flex; align-items:center; gap:8px; padding:8px 22px; font-size:12px; font-weight:600; border-bottom:1px solid var(--line); }
  .session-banner.scheduled { background: var(--paper); color: var(--ink-soft); }
  .session-banner.live { background: var(--moss-soft); color: var(--moss); }
  .session-banner.ended { background: var(--paper); color: var(--ink-soft); }
  .announce-card { background: var(--amber-soft); border:1px solid var(--amber); border-radius:10px; padding:12px 14px; }
  .announce-head { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; font-weight:700; color: var(--ink); flex-wrap:wrap; }
  .announce-time { font-size:10.5px; font-weight:400; color: var(--ink-soft); white-space:nowrap; }
  .announce-body { font-size:12px; color: var(--ink); margin-top:6px; line-height:1.6; white-space:pre-wrap; }
  .cal-header { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:10px; }
  .cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .cal-weekday { margin-bottom:4px; text-align:center; font-size:10.5px; color: var(--ink-soft); font-weight:700; }
  .cal-cell { position:relative; aspect-ratio:1; border:1px solid var(--line); border-radius:8px; background: var(--surface); cursor:pointer; font-family:inherit; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px; }
  .cal-cell.empty { border:none; background:none; cursor:default; }
  .cal-cell.today { border-color: var(--role-accent); }
  .cal-cell.selected { background: var(--role-accent-soft); border-color: var(--role-accent); }
  .cal-daynum { font-size:11px; font-weight:700; }
  .cal-dots { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; }
  .cal-dot { width:5px; height:5px; border-radius:50%; display:inline-block; }
  .cal-event-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; background: var(--surface); border:1px solid var(--line); border-left-width:4px; border-left-style:solid; border-radius:8px; padding:10px 12px; }
  .calendar-alert { display:flex; align-items:center; gap:10px; background: var(--rust-soft); border:1px solid var(--rust); border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  .calendar-alert-icon { font-size:22px; }
  .crumb b { color: var(--ink); }
  .canvas { flex:1; overflow-y:auto; padding:26px; }

  .panel-head h2 { font-family:'Noto Serif KR', serif; font-size:20px; margin:0 0 4px; }
  .panel-head p { font-size:13px; color: var(--ink-soft); margin:0 0 18px; }
  .grid { display:grid; gap:12px; }
  .grid-2 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(3,1fr); }
  .grid-4 { grid-template-columns: repeat(4,1fr); }
  @media (max-width:640px) { .grid-3,.grid-4 { grid-template-columns: repeat(2,1fr); } .grid-2 { grid-template-columns: 1fr; } }

  .stat-card { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat-label { font-size:11.5px; color: var(--ink-soft); }
  .stat-value { font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:600; margin-top:4px; }
  .stat-hint { font-size:11px; color: var(--ink-soft); margin-top:2px; }

  .bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .bar-label { width:56px; font-size:13px; flex-shrink:0; }
  .bar-track { display:flex; gap:3px; }
  .bar-cell { width:16px; height:14px; border-radius:3px; background: var(--paper); border:1px solid var(--line); }
  .bar-cell.on { background: var(--role-accent); border-color: var(--role-accent); }

  .pipeline { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .pipe-chip { font-size:12.5px; padding:7px 12px; border-radius:999px; background: var(--role-accent-soft); color: var(--role-accent); font-weight:600; }
  .pipe-arrow { color: var(--ink-soft); font-size:12px; }

  .book-card { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:left; font-family:inherit; cursor:default; width:100%; }
  .book-card.clickable { cursor:pointer; border-color: var(--role-accent); }
  .book-card.clickable:hover { transform: translateY(-2px); }
  .book-card.locked { opacity:.5; }
  .book-card.wide { max-width:320px; }
  .book-index { font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--role-accent); display:flex; align-items:center; gap:6px; }
  .book-title { font-family:'Noto Serif KR', serif; font-size:15px; margin-top:6px; }
  .book-status { font-size:11.5px; color: var(--ink-soft); margin-top:6px; }
  .book-status.complete { color: var(--role-accent); font-weight:700; }
  .subject-tag { font-size:10px; background: var(--role-accent-soft); color: var(--role-accent); padding:2px 7px; border-radius:999px; font-weight:700; }

  .flow-cta { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .flow-cta .fc-title { font-family:'Noto Serif KR', serif; font-size:15px; margin-bottom:6px; }
  .flow-cta .fc-desc { font-size:12.5px; color: var(--ink-soft); margin-bottom:14px; }

  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; font-weight:600; color: var(--ink-soft); font-size:11.5px; padding:6px 10px; border-bottom:1px solid var(--line); }
  .tbl td { padding:9px 10px; border-bottom:1px solid var(--line); }
  .tbl td.warn { color: var(--rust); font-weight:700; }

  .spark { display:flex; align-items:flex-end; gap:8px; height:120px; }
  .spark-bar { width:22px; background: var(--role-accent); border-radius:4px 4px 0 0; opacity:.85; }
  .spark-bar.spark-live { background: var(--ink); opacity:1; }

  .live-dot { width:6px; height:6px; border-radius:50%; background: var(--moss); display:inline-block; margin-right:6px; vertical-align:middle; animation: liveDot 1.4s infinite; }
  @keyframes liveDot { 0%{box-shadow:0 0 0 0 rgba(63,91,78,.45);} 100%{box-shadow:0 0 0 6px rgba(63,91,78,0);} }
  .row-live { background: var(--role-accent-soft); font-weight:600; }

  .btn { padding:9px 18px; border-radius:8px; border:none; background: var(--moss); color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn:hover { opacity:.92; }
  .btn.ghost { background: var(--surface); color: var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* ===== 책 상세 ===== */
  .book-detail-head { margin-bottom: 18px; }
  .week-tag { font-size:10.5px; font-weight:700; color: var(--role-accent); letter-spacing:.04em; }
  .book-detail-title { font-family:'Noto Serif KR', serif; font-size:21px; margin: 6px 0 6px; }
  .book-detail-desc { font-size:13px; color: var(--ink-soft); line-height:1.6; max-width:560px; }
  .intro-hook { background: var(--moss-soft); border-left:4px solid var(--moss); border-radius:0 10px 10px 0; padding:14px 18px; font-size:14px; font-style:italic; color: var(--ink); margin:16px 0 22px; line-height:1.65; max-width:640px; }
  .intro-section-label { font-size:11px; font-weight:700; color: var(--ink-soft); letter-spacing:.04em; margin-bottom:8px; }
  .person-card { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .person-card .pc-name { font-family:'Noto Serif KR', serif; font-weight:700; font-size:14px; }
  .person-card .pc-years { font-size:11px; color: var(--ink-soft); margin-left:6px; font-family:'JetBrains Mono', monospace; }
  .person-card .pc-role { font-size:11.5px; color: var(--moss); font-weight:700; margin:4px 0 6px; }
  .person-card .pc-desc { font-size:12.5px; line-height:1.65; color: var(--ink); }
  .intro-bg-box { background: var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; font-size:12.5px; line-height:1.75; color: var(--ink); }
  .text-row { display:flex; align-items:center; gap:14px; background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; width:100%; text-align:left; font-family:inherit; cursor:pointer; }
  .text-row.locked { opacity:.5; cursor:default; }
  .text-row .tr-num { width:28px; height:28px; border-radius:50%; background: var(--role-accent-soft); color: var(--role-accent); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; flex-shrink:0; }
  .text-row.complete .tr-num { background: var(--role-accent); color:#fff; }
  .text-row .tr-body { flex:1; }
  .text-row .tr-sub { font-family:'Noto Serif KR', serif; font-size:14.5px; }
  .text-row .tr-status { font-size:11.5px; color: var(--ink-soft); margin-top:3px; }

  /* ===== 학습 플로우 ===== */
  .flow-wrap { display:flex; flex-direction:column; height:680px; position:relative; }
  .chat-fab {
    position:absolute; right:20px; bottom:92px; width:54px; height:54px; border-radius:50%;
    background: var(--amber); color:#fff; border:none; font-size:24px; cursor:grab;
    box-shadow: 0 4px 14px rgba(0,0,0,.22); display:flex; align-items:center; justify-content:center; z-index:40;
    touch-action:none; user-select:none;
  }
  .chat-fab:active { cursor:grabbing; }
  .chat-fab:hover { opacity:.92; }
  .chat-fab-badge {
    position:absolute; top:-4px; right:-4px; background: var(--rust); color:#fff; font-size:10px; font-weight:700;
    min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;
    pointer-events:none;
  }
  .classroom-fab {
    position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:50%;
    background: var(--slate); color:#fff; border:none; font-size:24px; cursor:pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.22); display:flex; align-items:center; justify-content:center; z-index:40;
    animation: classroomPulse 1.4s infinite;
  }
  @keyframes classroomPulse { 0%{box-shadow:0 0 0 0 rgba(71,97,122,.5), 0 4px 14px rgba(0,0,0,.22);} 100%{box-shadow:0 0 0 12px rgba(71,97,122,0), 0 4px 14px rgba(0,0,0,.22);} }
  .chat-overlay {
    position:absolute; right:20px; bottom:156px; width:320px; max-width:calc(100% - 40px);
    background: var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.18);
    padding:14px; z-index:41;
  }
  .chat-overlay-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; margin-bottom:10px; gap:8px; cursor:move; touch-action:none; user-select:none; }
  .chat-overlay-head .coh-hint { color: var(--ink-soft); font-weight:400; font-size:10px; }
  .chat-overlay-close { background:none; border:none; font-size:14px; color: var(--ink-soft); cursor:pointer; padding:2px; }
  .nav-badge { background: var(--rust); color:#fff; font-size:10px; font-weight:700; border-radius:9px; padding:1px 6px; margin-left:4px; }
  .flow-head { padding:16px 26px 0; display:flex; align-items:center; justify-content:space-between; }
  .flow-head .wordmark { font-family:'Noto Serif KR', serif; font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px; }
  .flow-head .wordmark .dot { width:7px; height:7px; border-radius:50%; background: var(--moss); }
  .flow-exit { font-size:12px; color: var(--ink-soft); background:none; border:none; cursor:pointer; font-family:inherit; padding:2px 0; }
  .flow-exit:hover { color: var(--ink); }

  .tracker { display:flex; align-items:flex-start; gap:4px; padding:16px 26px 16px; border-bottom:1px solid var(--line); }
  .tstep { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; background:none; border:none; font-family:inherit; padding:2px 0; }
  .tstep .circ { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; border:1.5px solid var(--line); color: var(--ink-soft); background: var(--surface); }
  .tstep.done .circ { background: var(--moss); border-color: var(--moss); color:#fff; }
  .tstep.current .circ { border-color: var(--moss); color: var(--moss); box-shadow: 0 0 0 3px var(--moss-soft); }
  .tstep .tlabel { font-size:10px; color: var(--ink-soft); text-align:center; line-height:1.3; max-width:64px; }
  .tstep.current .tlabel { color: var(--ink); font-weight:700; }

  .flow-body { flex:1; overflow-y:auto; padding:26px; }
  .step-title { font-family:'Noto Serif KR', serif; font-size:19px; margin:0 0 4px; }
  .step-desc { font-size:13px; color: var(--ink-soft); margin:0 0 18px; line-height:1.6; }

  .excerpt { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 20px; font-size:14.5px; line-height:2.3; margin-bottom:16px; }
  .excerpt .concept { color: var(--moss); font-weight:700; cursor:pointer; border-bottom:1.5px dotted var(--moss); }
  .word-gap {
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:1.5em; vertical-align:-0.32em; cursor:pointer; position:relative;
  }
  .word-gap .gap-bar {
    display:block; width:4px; height:100%; border-radius:3px; background: transparent; transition: background-color .12s ease;
  }
  .word-gap:hover .gap-bar { background: var(--ink-soft); opacity:.35; }
  .word-gap.marked .gap-bar {
    background: var(--rust);
    box-shadow: 0 0 0 3px var(--rust-soft);
  }
  .word-gap.static { cursor:default; }
  .word-gap.static:hover .gap-bar { background: transparent; }
  .word-gap.static.marked .gap-bar { background: var(--rust); box-shadow: 0 0 0 3px var(--rust-soft); }

  .popover { background: var(--moss-soft); border:1px solid var(--moss); border-radius:10px; padding:14px 16px; margin-bottom:16px; font-size:13px; line-height:1.7; }
  .popover b { color: var(--moss); }

  .qa-card { background: var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:14px; }
  .qa-num { font-size:11px; color: var(--ink-soft); margin-bottom:6px; }
  .qa-q { font-size:14.5px; font-weight:700; margin-bottom:14px; line-height:1.5; }
  .qa-opts { display:flex; flex-direction:column; gap:8px; }
  .qa-opt { text-align:left; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background: var(--paper); cursor:pointer; font-size:13.5px; font-family:inherit; line-height:1.4; }
  .qa-opt.ox { display:inline-block; width:70px; text-align:center; margin-right:8px; }
  .qa-opt:hover:not(:disabled) { border-color: var(--moss); }
  .qa-opt.correct { background: var(--moss-soft); border-color: var(--moss); font-weight:700; }
  .qa-opt.wrong { background: var(--rust-soft); border-color: var(--rust); }
  .qa-opt:disabled { cursor:default; }

function homeworkWordBank(sectionKey){
  const book = getReportBook();
  let terms = [];
  book.texts.forEach(t => { terms = terms.concat(TEXTS[t.id].keyTerms); });
  const uniqueTerms = [...new Set(terms)];
  const authors = (BOOK_INTRO[book.id] ? BOOK_INTRO[book.id].people.map(p=>p.name) : []);
  if (sectionKey === "topic") return uniqueTerms.slice(0,8);
  if (sectionKey === "intro") return [...authors, "시대적 배경", "책 소개", "주제 제시", ...uniqueTerms.slice(0,4)];
  if (sectionKey === "body") return [...uniqueTerms.slice(0,12), "예를 들어", "구체적으로"];
  if (sectionKey === "conclusion") return ["저자의 의도","저자의 관점","핵심 메시지","나는 이렇게 생각한다","인상 깊었던 점","느낀 점","그러므로","결론적으로"];
  return uniqueTerms.slice(0,10);
}
// 학생이 고른 단어·스피치 조각을 AI가 각 문단의 역할에 맞는 자연스러운 문장으로 이어붙인다.
function naturalizeSection(sectionKey, words, speechText){
  const joined = words.join(", ");
  const templates = {
    topic: `이 글에서 다루는 주제는 ${joined}입니다.`,
    intro: `${joined}를 중심으로 이 책의 이야기를 살펴보려 합니다.`,
    body: `구체적으로 살펴보면, ${joined}와 같은 내용을 그 근거와 예시로 들 수 있습니다.`,
    conclusion: `이러한 내용을 통해 ${joined}에 대해 생각해보게 되었습니다.`,
  };
  let sentence = words.length ? templates[sectionKey] : "";
  if (speechText) sentence = [sentence, speechText].filter(Boolean).join(" ");
  return sentence;
}
function composeLowGradeText(){
  const hw = state.homework;
  return SECTION_ORDER.map(sec => naturalizeSection(sec, hw.blocks[sec], hw.speechText[sec])).filter(Boolean).join("\n\n");
}
function assembleHighGradeText(){
  const hw = state.homework;
  return hw.title ? `${hw.title}\n\n${hw.essay}` : hw.essay;
}
function homeworkCharCount(){
  const hw = state.homework;
  if (hw.gradeMode === "low") return composeLowGradeText().replace(/\s/g,"").length;
  return (hw.title + hw.essay).replace(/\s/g,"").length;
}
function evaluateEssay(text){
  const trimmed = text.trim();
  const wordCount = trimmed ? trimmed.replace(/\s+/g," ").split(" ").length : 0;
  const paragraphs = trimmed.split(/\n+/).filter(p=>p.trim()).length || (trimmed?1:0);
  const hasLogic = /왜냐하면|그러므로|따라서|하지만|그러나|이러한 이유로/.test(trimmed);
  const hasOpinion = /나는|내 생각|저는|생각합니다|생각한다|느꼈다|믿는다/.test(trimmed);
  const hasConclusion = /결론적으로|결국|정리하면|요약하면|마지막으로/.test(trimmed);
  const hasExample = /예를 들어|예시로|사례로/.test(trimmed);
  const base = Math.min(78, 40 + Math.round(wordCount/6));
  const scores = {
    topic:        Math.min(96, base + (paragraphs>=3?10:paragraphs>=2?5:0)),
    expression:   Math.min(96, base + (wordCount>80?8:0)),
    grammar:      Math.min(96, base + (wordCount>50 && wordCount<400 ? 10:0)),
    logic:        Math.min(96, base + (hasLogic?14:0)),
    structure:    Math.min(96, base + (paragraphs>=3?12:paragraphs>=2?6:0)),
    completeness: Math.min(96, base + (hasConclusion?12:0)),
    info:         Math.min(96, base + (hasExample?12:0)),
    opinion:      Math.min(96, base + (hasOpinion?14:0)),
  };
  Object.keys(scores).forEach(k => { if (wordCount===0) scores[k]=0; });
  const overall = wordCount===0 ? 0 : Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/8);
  const comments = {
    topic: paragraphs>=2 ? "주제를 중심으로 문단이 잘 나뉘어 있습니다." : "문단을 나눠 주제를 더 뚜렷하게 드러내 보세요.",
    expression: wordCount>80 ? "구체적인 표현이 담겨 있습니다." : "조금 더 구체적인 표현과 예시를 더해보세요.",
    grammar: (wordCount>50 && wordCount<400) ? "분량과 어법이 대체로 적절합니다." : (wordCount<=50 ? "분량이 다소 짧습니다. 생각을 더 풀어써 보세요." : "분량이 깁니다. 핵심만 간결하게 정리해보세요."),
    logic: hasLogic ? "'그러므로', '왜냐하면' 같은 연결어로 논리가 잘 이어집니다." : "문장 사이를 '그러므로', '하지만' 같은 연결어로 이어보면 논리가 더 분명해져요.",
    structure: paragraphs>=3 ? "글의 흐름(서론-본론-결론)이 잘 드러납니다." : "문단을 서론-본론-결론으로 나눠보면 흐름이 더 뚜렷해집니다.",
    completeness: hasConclusion ? "마무리 문장이 있어 글이 완결됩니다." : "마지막에 정리하는 문장을 추가해 글을 완결지어 보세요.",
    info: hasExample ? "구체적인 예시를 활용해 설득력이 있습니다." : "배운 개념이나 사례를 예시로 들어보면 좋겠습니다.",
    opinion: hasOpinion ? "자신의 생각을 분명하게 드러냈습니다." : "'나는 ~라고 생각한다'처럼 자신의 의견을 직접 표현해보세요.",
  };
  return { scores, overall, comments, wordCount, paragraphs };
}

function computeHelpFlags(){

  if (quizAvg !== null && quizAvg < 70) flags.push("독서 퀴즈 정답률이 낮아요 (평균 " + quizAvg + "%)");
  if (compAvg !== null && compAvg < 70) flags.push("독해 문제 정답률이 낮아요 (평균 " + compAvg + "%)");
  if (speechAvg !== null && speechAvg < 70) flags.push("스피치 종합 점수가 낮아요 (평균 " + speechAvg + "점)");
  if (state.activity.records.length > 0) flags.push("스피치에서 핵심어 사용이 부족해요 (핵심어 항목 55점)");
  const hw = state.homework.submissions[state.homework.submissions.length-1];
  if (hw && hw.eval.overall < 60) flags.push("가정 과제 첨삭 점수가 낮아요 (" + hw.eval.overall + "점)");
  return flags;
}

function pickMaxType(scoreMap){
  let best = null, bestVal = -Infinity;
  Object.entries(scoreMap).forEach(([k,v]) => { if (v > bestVal){ bestVal = v; best = k; } });
  return best;
}
// 실제 학습 데이터(정답률·사고력·스피치·읽기훈련·과제)를 6개 영역 24유형 기준 점수로 환산한다.
function computeAllTypeScores(){
  const quizAvg = avgField("quizPct"), compAvg = avgField("compPct");
  const ladderAvg = avgField("ladderScore"), diagramAvg = avgField("diagramScore");
  const speechAvg = avgField("speechAvg");
  if (quizAvg === null) return null;
  const recs = state.activity.records;
  const readingMarksAvg = recs.reduce((a,r)=>a+(r.readingMarkedCount||0),0) / recs.length;
  const diagramWordsAvg = recs.reduce((a,r)=>a+(r.diagramSelected?r.diagramSelected.length:0),0) / recs.length;
  const hw = state.homework.submissions;
  const hwLatest = hw[hw.length-1];
  const hwCount = hw.length;
  const hwTrendUp = hw.length>=2 && hw[hw.length-1].eval.overall > hw[0].eval.overall;
  const c = compAvg===null?quizAvg:compAvg, l=ladderAvg||0, d=diagramAvg||0, sp=speechAvg||0;
  return {
    cognitive: { left_analytic:quizAvg, left_experimental:d, right_strategic:l, right_intuitive:sp },
    judgment: { logical:quizAvg, creative:d, imaginative:l, reality:c },
    activity: { static:3, dual:hwCount, manipulative:diagramWordsAvg, dynamic:readingMarksAvg },
    leadership: { expert:quizAvg, moderate:c, goal: hwTrendUp?90:55, techno:(d+sp)/2 },
    sociality: hwLatest ? { independent:hwLatest.eval.scores.opinion, prudent:hwLatest.eval.scores.logic, relational:hwLatest.eval.scores.expression, altruistic:hwLatest.eval.scores.completeness } : null,
    execution: hwLatest ? { research:hwLatest.eval.scores.info, discerning: hwCount>1?85:50, responsible:hwLatest.eval.scores.completeness, meticulous:hwLatest.eval.scores.grammar } : null,
  };
}
function computeMSCProfile(){
  const maps = computeAllTypeScores();
  if (!maps) return null;
  const profile = {};
  Object.keys(maps).forEach(catKey => { profile[catKey] = maps[catKey] ? pickMaxType(maps[catKey]) : null; });
  return profile;
}
// 4096(4^6) 가지 조합 대신, 6개 영역 중 가장 뚜렷하게(격차 크게) 두드러지는 영역의 유형 하나를 "대표 유형"으로 뽑는다 — 24유형 아바타 배정에 사용.
function computeDominantType(){
  const maps = computeAllTypeScores();
  if (!maps) return null;
  let best = null, bestGap = -Infinity;
  Object.entries(maps).forEach(([catKey, scoreMap]) => {
    if (!scoreMap) return;
    const entries = Object.entries(scoreMap).sort((a,b)=>b[1]-a[1]);
    const gap = entries[0][1] - (entries[1] ? entries[1][1] : 0);
    if (gap > bestGap){ bestGap = gap; best = { catKey, typeId: entries[0][0] }; }
  });
  return best ? `${best.catKey}:${best.typeId}` : null;
}

  const xpPerLevel = 150;
  const level = Math.floor(av.xp / xpPerLevel) + 1;
  const intoLevel = av.xp % xpPerLevel;
  return { level, intoLevel, xpPerLevel, pct: Math.round((intoLevel/xpPerLevel)*100) };

function growthTreeSVG(mode){ // mode: 'reading' | 'knowledge'
  const bark = "#6B4F3B";
  const branchDefs = [
    { pathD:"M320,340 Q220,300 100,160", nodes:[{x:250,y:290},{x:170,y:220},{x:100,y:160}], labelPos:{x:96,y:150}, anchor:"middle" },
    { pathD:"M320,300 Q260,220 205,80",  nodes:[{x:280,y:230},{x:240,y:150},{x:205,y:80}],  labelPos:{x:205,y:68},  anchor:"middle" },
    { pathD:"M320,300 Q380,220 435,80",  nodes:[{x:360,y:230},{x:400,y:150},{x:435,y:80}],  labelPos:{x:435,y:68},  anchor:"middle" },
    { pathD:"M320,340 Q420,300 540,160", nodes:[{x:390,y:290},{x:470,y:220},{x:540,y:160}], labelPos:{x:544,y:150}, anchor:"middle" },
  ];
  let branchesSVG = "", nodesSVG = "", labelsSVG = "";
  state.books.forEach((book, bi) => {
    const def = branchDefs[bi];
    if (!def) return;
    const grown = book.status !== "locked";
    const shortTitle = book.title.length > 9 ? book.title.slice(0,8) + "…" : book.title;
    branchesSVG += `<path d="${def.pathD}" fill="none" stroke="${grown?bark:'#D8D9CE'}" stroke-width="${grown?9:5}" stroke-linecap="round" stroke-dasharray="${grown?'none':'5 7'}" opacity="${grown?1:0.7}"/>`;
    labelsSVG += `<text x="${def.labelPos.x}" y="${def.labelPos.y}" font-size="10.5" font-weight="700" fill="${grown?'#171B17':'#9AA39B'}" text-anchor="${def.anchor}">${book.week}주 · ${esc(shortTitle)}</text>`;
    book.texts.forEach((t, ti) => {
      const pos = def.nodes[ti];
      if (!pos) return;
      let fill="#FFFFFF", stroke="#D8D9CE", dash="4 3", op=0.55, labelColor="#9AA39B";
      if (t.status === "complete"){ fill="#3F5B4E"; stroke="#3F5B4E"; dash="none"; op=1; labelColor="#171B17"; }
      else if (t.status === "progress"){ fill="#F1E4CD"; stroke="#B5792A"; dash="none"; op=1; labelColor="#171B17"; }
      if (mode === "reading"){
        const icon = t.status==="complete" ? "📗" : t.status==="progress" ? "📖" : "📘";
        nodesSVG += `<circle cx="${pos.x}" cy="${pos.y}" r="15" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-dasharray="${dash}" opacity="${op}"/>
          <text x="${pos.x}" y="${pos.y+5}" font-size="13" text-anchor="middle">${icon}</text>`;
      } else {
        const conceptWord = Object.keys(TEXTS[t.id].concepts)[0];
        const shortWord = conceptWord.length > 7 ? conceptWord.slice(0,6) + "…" : conceptWord;
        nodesSVG += `<circle cx="${pos.x}" cy="${pos.y}" r="9" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-dasharray="${dash}" opacity="${op}"/>
          <text x="${pos.x}" y="${pos.y+22}" font-size="9" font-weight="700" text-anchor="middle" fill="${labelColor}">${esc(shortWord)}</text>`;
      }
    });
  });
  const plateText = mode === "reading" ? "B180 독서 커리큘럼" : "B180 지식 지도";
  return `<svg class="tree-svg" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg">
    <path d="M320,430 Q255,442 195,458" fill="none" stroke="${bark}" stroke-width="6" stroke-linecap="round"/>
    <path d="M320,430 L320,458" fill="none" stroke="${bark}" stroke-width="6" stroke-linecap="round"/>
    <path d="M320,430 Q385,442 445,458" fill="none" stroke="${bark}" stroke-width="6" stroke-linecap="round"/>
    <text x="195" y="450" font-size="11" font-weight="700" fill="${bark}" text-anchor="middle">문해력</text>
    <text x="320" y="450" font-size="11" font-weight="700" fill="${bark}" text-anchor="middle">사고력</text>
    <text x="445" y="450" font-size="11" font-weight="700" fill="${bark}" text-anchor="middle">문제해결력</text>
    <path d="M300,440 L305,300 Q320,288 335,300 L340,440 Z" fill="${bark}"/>
    ${branchesSVG}
    ${nodesSVG}
    ${labelsSVG}
    <rect x="242" y="382" width="156" height="21" rx="10.5" fill="#171B17"/>
    <text x="320" y="397" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">${plateText}</text>
  </svg>`;
}

function rootMark(visited){
  const filled = Math.min(visited, 6);

  const paths = branches.map((d,i)=>`<path d="${d}" class="root-branch${i<filled?" on":""}"/>`).join("");
  return `<svg viewBox="0 0 140 60" class="root-mark"><line x1="70" y1="60" x2="70" y2="34" class="root-trunk"/>${paths}</svg>`;
}

function liveStudentRow(){
  const totalTexts = state.books.reduce((a,b)=>a+b.texts.length,0);
  const completedTexts = state.books.reduce((a,b)=>a+b.texts.filter(t=>t.status==="complete").length,0);
  const readingProgress = Math.round((completedTexts/totalTexts)*100);
  const quizAvg = avgField("quizPct");
  const ladderAvg = avgField("ladderScore"), diagramAvg = avgField("diagramScore");
  const thinkAvg = (ladderAvg!==null && diagramAvg!==null) ? Math.round((ladderAvg+diagramAvg)/2) : null;
  const speechAvg = avgField("speechAvg");
  const flags = computeHelpFlags();
  const status = quizAvg===null ? "학습 전" : flags.length>0 ? "도움 필요" : "정상";
  return { name:"김민준 (나)", reading: readingProgress+"%", quiz: quizAvg===null?"-":quizAvg+"%", think: thinkAvg===null?"-":String(thinkAvg), speech: speechAvg===null?"-":String(speechAvg), status, flags };
}

function sendChatMessage(kind){
  kind = kind || "student";

}

function renderTestMCStep(ts, test){

function calEventsOn(dateStr){ return state.calendar.events.filter(e=>e.date===dateStr).sort((a,b)=>a.time.localeCompare(b.time)); }
function checkCalendarAlarms(){
  if (state.calendarAlert) return; // 이미 뜬 알람이 있으면 대기
  const now = new Date();
  const dateStr = now.toISOString().slice(0,10);
  const timeStr = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const hit = state.calendar.events.find(e => e.notify && !e.notified && e.date===dateStr && e.time===timeStr);
  if (hit){ hit.notified = true; state.calendarAlert = hit; render(); }
}
setInterval(checkCalendarAlarms, 15000);
function calendarAlertBannerHTML(){
  const ev = state.calendarAlert;
  if (!ev) return "";
  const meta = CAL_TYPE_META[ev.type];
  return `<div class="calendar-alert">
    <span class="calendar-alert-icon">⏰</span>
    <div style="flex:1;">
      <div style="font-weight:700; font-size:13px;">${meta.icon} ${esc(ev.title)} — 지금 시작할 시간입니다</div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px;">${ev.time}${ev.endTime?" ~ "+ev.endTime:""}${ev.description?" · "+esc(ev.description):""}</div>
    </div>
    <button class="btn ghost" id="dismissCalAlert" style="padding:6px 12px; font-size:11.5px;">확인</button>
  </div>`;
}

function bindTeacherCalendar(){
  const cal = state.calendar, f = state.calendarForm;
  document.querySelectorAll("[data-caldate]").forEach(el => el.addEventListener("click", () => { cal.selectedDate = el.dataset.caldate; render(); }));
  const prevBtn = document.getElementById("calPrevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => { cal.viewMonth--; if (cal.viewMonth<0){ cal.viewMonth=11; cal.viewYear--; } render(); });
  const nextBtn = document.getElementById("calNextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => { cal.viewMonth++; if (cal.viewMonth>11){ cal.viewMonth=0; cal.viewYear++; } render(); });
  document.querySelectorAll("[data-caltype]").forEach(el => el.addEventListener("click", () => { f.type = el.dataset.caltype; render(); }));

  const fMap = { calDate:"date", calTime:"time", calEndTime:"endTime", calTitle:"title", calDesc:"description" };
  Object.entries(fMap).forEach(([id,key]) => { const el=document.getElementById(id); if (el) el.addEventListener("input", e => { f[key]=e.target.value; }); });
  const notifyEl = document.getElementById("calNotify"); if (notifyEl) notifyEl.addEventListener("change", e => { f.notify = e.target.checked; });

  const saveBtn = document.getElementById("calSaveBtn");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    if (!f.title.trim() || !f.date || !f.time) return;
    if (f.editId){
      const ev = cal.events.find(e=>e.id===f.editId);
      Object.assign(ev, { date:f.date, time:f.time, endTime:f.endTime, title:f.title.trim(), description:f.description.trim(), type:f.type, notify:f.notify, notified:false });
    } else {
      cal.events.push({ id:newId("cal"), date:f.date, time:f.time, endTime:f.endTime, title:f.title.trim(), description:f.description.trim(), type:f.type, notify:f.notify, notified:false });
    }
    cal.selectedDate = f.date;
    state.calendarForm = { date:"", time:"", endTime:"", title:"", type:"class", description:"", notify:true };
    render();
  });
  const cancelBtn = document.getElementById("calCancelEdit");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.calendarForm = { date:"", time:"", endTime:"", title:"", type:"class", description:"", notify:true }; render(); });
  document.querySelectorAll("[data-editcal]").forEach(el => el.addEventListener("click", () => {
    const ev = cal.events.find(e=>e.id===el.dataset.editcal);
    if (!ev) return;
    state.calendarForm = { editId:ev.id, date:ev.date, time:ev.time, endTime:ev.endTime, title:ev.title, type:ev.type, description:ev.description, notify:ev.notify };
    render();
  }));
  document.querySelectorAll("[data-delcal]").forEach(el => el.addEventListener("click", () => {
    const idx = cal.events.findIndex(e=>e.id===el.dataset.delcal);
    if (idx>=0) cal.events.splice(idx,1);
    render();
  }));
  const dismissBtn = document.getElementById("dismissCalAlert");
  if (dismissBtn) dismissBtn.addEventListener("click", () => { state.calendarAlert = null; render(); });
}

function classroomTypeLabel(type){ return { image:"이미지", video:"동영상", audio:"음악/오디오", doc:"문서", slides:"프레젠테이션" }[type] || ""; }
function isYouTubeUrl(url){ return /youtube\.com\/watch|youtu\.be\//.test(url||""); }
function toYouTubeEmbed(url){ const m = url.match(/(?:v=|youtu\.be\/)([\w-]{11})/); return m ? `https://www.youtube.com/embed/${m[1]}` : url; }
function renderShareContent(cs){
  if (cs.type === "image") return `<img src="${cs.content}" style="max-width:100%; border-radius:10px; margin-top:10px; display:block;"/>`;
  if (cs.type === "video"){
    if (cs.isExternalUrl && isYouTubeUrl(cs.content)) return `<iframe src="${toYouTubeEmbed(cs.content)}" style="width:100%; aspect-ratio:16/9; border:none; border-radius:10px; margin-top:10px;" allowfullscreen></iframe>`;
    return `<video src="${cs.content}" controls autoplay style="width:100%; border-radius:10px; margin-top:10px; background:#000;"></video>`;
  }
  if (cs.type === "audio") return `<audio src="${cs.content}" controls autoplay style="width:100%; margin-top:10px;"></audio>`;
  if (cs.type === "doc") return `<div class="intro-bg-box" style="margin-top:10px; white-space:pre-wrap; max-height:340px; overflow-y:auto;">${esc(cs.content)}</div>`;
  if (cs.type === "slides"){
    const slide = cs.slides[cs.slideIndex] || { title:"", body:"" };
    return `<div class="qa-card" style="margin-top:10px; text-align:center; min-height:180px; display:flex; flex-direction:column; justify-content:center;">
      <div style="font-family:'Noto Serif KR',serif; font-weight:700; font-size:18px; margin-bottom:10px;">${esc(slide.title)}</div>
      <div style="font-size:13px; white-space:pre-wrap; line-height:1.7;">${esc(slide.body)}</div>
      <div style="margin-top:14px; font-size:11px; color:var(--ink-soft);">슬라이드 ${cs.slideIndex+1} / ${cs.slides.length}</div>
    </div>`;
  }
  return "";
}

const ATTENDANCE_LOG = [
  { label:"7/1(월)", status:"출석" }, { label:"7/3(수)", status:"출석" },
  { label:"7/8(월)", status:"출석" }, { label:"7/10(수)", status:"지각" },
  { label:"7/15(월)", status:"출석" }, { label:"7/17(수)", status:"결석" },
  { label:"7/22(월)", status:"출석" }, { label:"7/24(수)", status:"출석" },

function computeAttendance(){
  const weight = { "출석":1, "지각":0.5, "결석":0 };
  const sum = ATTENDANCE_LOG.reduce((a,x)=>a+weight[x.status],0);
  const rate = Math.round((sum/ATTENDANCE_LOG.length)*100);
  return { rate, log: ATTENDANCE_LOG };

/* =========================== 교재팀 · 책/텍스트 DB 관리 =========================== */
function newId(prefix){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*100); }
function parseConcepts(text){
  const obj = {};
  text.split("\n").map(l=>l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split("|").map(s=>s.trim());
    if (parts.length>=4 && parts[0]) obj[parts[0]] = { def:parts[1], why:parts[2], example:parts[3] };
  });
  return obj;
}
function parseQuiz(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line => {
    const parts = line.split("|").map(s=>s.trim());
    const type = (parts[0]||"mc").toLowerCase();
    const q = parts[1]||"";
    const fbCorrect = parts[4] || "정답입니다.";
    const fbWrong = parts[5] || "본문을 다시 확인해보세요.";
    if (type === "ox") return { type:"ox", q, answer:(parts[3]||"O").toUpperCase(), fb:{correct:fbCorrect, wrong:fbWrong} };
    if (type === "short") return { type:"short", q, answer:(parts[3]||"").split("/").map(s=>s.trim()).filter(Boolean), fb:{correct:fbCorrect, wrong:fbWrong} };
    return { type:"mc", q, opts:(parts[2]||"").split(",").map(s=>s.trim()).filter(Boolean), answer:(parts[3]||"").trim(), fb:{correct:fbCorrect, wrong:fbWrong} };
  }).filter(q=>q.q);
}
function parseComprehension(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line => {
    const parts = line.split("|").map(s=>s.trim());
    return { label:parts[0]||"내용", q:parts[1]||"", opts:(parts[2]||"").split(",").map(s=>s.trim()).filter(Boolean), answer:(parts[3]||"").trim(), explain:parts[4]||"" };
  }).filter(c=>c.q);
}
function loadTextIntoForm(textId){
  const td = TEXTS[textId];
  const f = state.adminUI.textForm;
  f.subtitle = td.subtitle; f.passage = td.passage;
  f.keyTerms = (td.keyTerms||[]).join(", ");
  f.conceptsText = Object.entries(td.concepts||{}).map(([w,c])=>`${w} | ${c.def} | ${c.why} | ${c.example}`).join("\n");
  f.sentenceText = td.sentence ? td.sentence.text : "";
  f.sentenceGuided = td.sentence ? (td.sentence.guided||[]).join(", ") : "";
  f.sentenceAnswer = td.sentence ? td.sentence.answer : "";
  f.quizText = (td.quiz||[]).map(q => {
    const ans = q.type==="short" ? q.answer.join("/") : q.answer;
    return `${q.type} | ${q.q} | ${q.type==="mc"?(q.opts||[]).join(","):""} | ${ans} | ${q.fb?q.fb.correct:""} | ${q.fb?q.fb.wrong:""}`;
  }).join("\n");
  f.compText = (td.comprehension||[]).map(c => `${c.label} | ${c.q} | ${(c.opts||[]).join(",")} | ${c.answer} | ${c.explain}`).join("\n");
  f.summaryD1 = td.summary ? (td.summary.keywordsD1||[]).join(", ") : "";
  f.summaryD2 = td.summary ? (td.summary.keywordsD2||[]).join(", ") : "";
  f.summaryD3 = td.summary ? (td.summary.keywordsD3||[]).join(", ") : "";
  f.summaryFull = td.summary ? td.summary.full : "";
  f.speechTopic = td.speechTopic || "";
}

  return { subtitle:"", passage:"", keyTerms:"", conceptsText:"", sentenceText:"", sentenceGuided:"", sentenceAnswer:"", quizText:"", compText:"", summaryD1:"", summaryD2:"", summaryD3:"", summaryFull:"", speechTopic:"" };

  const ui = state.adminUI, f = ui.textForm;

    diagramDefault: keyTerms.join(" → "),

function avg2(...vals){
  const v = vals.filter(x=>x!==null && x!==undefined);
  return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null;
}
// 정기 테스트 성적 + 평소 수업 관찰 데이터를 종합해 7개 역량 지표를 산출한다.
function computeCompetencies(){
  const ts = state.testSession;
  const quizAvg = avgField("quizPct"), compAvg = avgField("compPct");
  const ladderAvg = avgField("ladderScore"), diagramAvg = avgField("diagramScore"), speechAvg = avgField("speechAvg");
  const hw = state.homework.submissions; const hwLatest = hw[hw.length-1];
  const mcPct = (ts && ts.status==="completed") ? Math.round((ts.mc.correctCount/ts.mc.answers.length)*100) : null;
  const testSpeech = (ts && ts.speech.overall!==null) ? ts.speech.overall : null;
  const testEssay = (ts && ts.essay.eval) ? ts.essay.eval.overall : null;
  return {
    reading:     { label:"읽기",            score: avg2(quizAvg, mcPct) },
    analysis:    { label:"분석과 추론",      score: avg2(compAvg, mcPct) },
    thinking:    { label:"사고력·문제해결력", score: avg2(ladderAvg, diagramAvg) },
    application: { label:"응용력",           score: avg2(diagramAvg, hwLatest?hwLatest.eval.scores.info:null) },
    critical:    { label:"비판적 사고",       score: avg2(hwLatest?hwLatest.eval.scores.logic:null, hwLatest?hwLatest.eval.scores.opinion:null) },
    writing:     { label:"글쓰기 능력",       score: avg2(hwLatest?hwLatest.eval.overall:null, testEssay) },
    speaking:    { label:"말하기 능력",       score: avg2(speechAvg, testSpeech) },
  };
}

function bindStudentTest(){
  const ts = state.testSession;
  if (!ts) return;
  const startBtn = document.getElementById("startTestBtn");
  if (startBtn) startBtn.addEventListener("click", () => { ts.status="in_progress"; ts.startedAt=Date.now(); ts.step="mc"; render(); });
  if (ts.status !== "in_progress") return;
  const test = state.testBank.find(t=>t.id===ts.testId);
  if (ts.step === "mc"){
    const s = ts.mc; const q = test.mc[s.i];
    document.querySelectorAll("[data-testopt]").forEach(el => el.addEventListener("click", () => {
      s.picked = el.dataset.testopt; s.checked = true; s.isCorrect = s.picked===q.answer; if (s.isCorrect) s.correctCount++;
      s.answers.push({ q:q.q, picked:s.picked, correct:s.isCorrect });
      render();
    }));
    const nextBtn = document.getElementById("testMcNext");
    if (nextBtn) nextBtn.addEventListener("click", () => {
      if (s.i === test.mc.length-1) ts.step = "speech"; else { s.i++; s.picked=null; s.checked=false; }
      render();
    });
  } else if (ts.step === "speech"){
    const s = ts.speech;
    const micBtn = document.getElementById("testMicBtn");
    if (micBtn) micBtn.addEventListener("click", () => {
      if (!s.recording && !s.transcribed){ s.recording=true; s.seconds=0; s.timer=setInterval(()=>{ s.seconds++; render(); },1000); render(); }
      else if (s.recording){ s.recording=false; s.transcribed=true; clearInterval(s.timer); render(); }
    });
    const evalBtn = document.getElementById("testSpeechEval");
    if (evalBtn) evalBtn.addEventListener("click", () => {
      s.evaluated = true; s.scores = SPEECH_ITEMS; s.overall = Math.round(SPEECH_ITEMS.reduce((a,[,v])=>a+v,0)/SPEECH_ITEMS.length);
      render();
    });
    const toEssay = document.getElementById("toEssayBtn");
    if (toEssay) toEssay.addEventListener("click", () => { ts.step = "essay"; render(); });
  } else if (ts.step === "essay"){
    const input = document.getElementById("testEssayInput");
    if (input) input.addEventListener("input", e => { ts.essay.text = e.target.value; });
    const submitBtn = document.getElementById("testEssaySubmit");
    if (submitBtn) submitBtn.addEventListener("click", () => {
      const text = document.getElementById("testEssayInput").value.trim();
      if (!text) return;
      ts.essay.text = text; ts.essay.eval = evaluateEssay(text);
      ts.status = "completed"; ts.completedAt = Date.now(); ts.step = "done";
      const mcPct = Math.round((ts.mc.correctCount/ts.mc.answers.length)*100);
      awardPoints(30 + Math.round(avg2(mcPct, ts.speech.overall, ts.essay.eval.overall)/3));
      render();
    });
  }
}
function bindStudentHomework(){
  const hw = state.homework;
  const gLow = document.getElementById("hwGradeLow"); if (gLow) gLow.addEventListener("click", () => { hw.gradeMode="low"; render(); });
  const gHigh = document.getElementById("hwGradeHigh"); if (gHigh) gHigh.addEventListener("click", () => { hw.gradeMode="high"; render(); });

  if (hw.gradeMode === "low"){
    document.querySelectorAll("[data-hwtab]").forEach(el => el.addEventListener("click", () => { hw.activeSection = el.dataset.hwtab; render(); }));
    document.querySelectorAll("[data-hwword]").forEach(el => el.addEventListener("click", () => {
      hw.blocks[hw.activeSection].push(el.dataset.hwword); hw.composed = false; render();
    }));
    document.querySelectorAll("[data-hwremove]").forEach(el => el.addEventListener("click", () => {
      const [sec, idx] = el.dataset.hwremove.split(":"); hw.blocks[sec].splice(Number(idx),1); hw.composed = false; render();
    }));
    document.querySelectorAll("[data-hwspeech]").forEach(el => el.addEventListener("click", () => {
      const sec = el.dataset.hwspeech;
      if (hw.recording.section === sec){
        clearInterval(hw.recording.timer);
        hw.speechText[sec] = (hw.speechText[sec] ? hw.speechText[sec]+" " : "") + SPEECH_TEMPLATES[sec];
        hw.recording = { section:null, seconds:0, timer:null };
        hw.composed = false;
        render();
      } else {
        hw.recording.section = sec; hw.recording.seconds = 0;
        hw.recording.timer = setInterval(() => { hw.recording.seconds++; render(); }, 1000);
        render();
      }
    }));
    const composeBtn = document.getElementById("hwCompose");
    if (composeBtn) composeBtn.addEventListener("click", () => { hw.composedText = composeLowGradeText(); hw.composed = true; render(); });
  } else if (!hw.outlineReady){
    SECTION_ORDER.forEach(s => {
      const el = document.getElementById("hw-outline-"+s);
      if (el) el.addEventListener("input", e => { hw.outline[s] = e.target.value; });
    });
    const readyBtn = document.getElementById("hwOutlineReady");
    if (readyBtn) readyBtn.addEventListener("click", () => { hw.outlineReady = true; render(); });
  } else {
    const titleEl = document.getElementById("hwTitle");
    if (titleEl) titleEl.addEventListener("input", e => { hw.title = e.target.value; });
    const essayEl = document.getElementById("hwEssay");
    if (essayEl) essayEl.addEventListener("input", e => { hw.essay = e.target.value; });
    const backBtn = document.getElementById("hwBackToOutline");
    if (backBtn) backBtn.addEventListener("click", () => { hw.outlineReady = false; render(); });
  }

  const btn = document.getElementById("hwSubmit");
  if (btn) btn.addEventListener("click", () => {
    const text = (hw.gradeMode === "low" ? hw.composedText : assembleHighGradeText()).trim();
    if (!text) return;
    const evalResult = evaluateEssay(text);
    state.homework.submissions.push({ id: Date.now(), text, submittedAt: Date.now(), eval: evalResult, teacherComment: "" });
    awardPoints(15 + Math.round(evalResult.overall/4));
    render();

  });
}

/* =========================== 학습 플로우 (STEP1~8) =========================== */
function markDone(id){ state.flow.done[id] = true; }

function excerptHTML(clickableGaps){
  const td = currentTextData();
  const words = td.passage.split(" ");
  let out = "";
  words.forEach((w,i) => {
    let piece = esc(w);
    Object.keys(td.concepts).forEach(c => { if (w.includes(c)) piece = piece.replace(c, `<span class="concept" data-concept="${c}">${c}</span>`); });
    out += piece;
    if (i < words.length - 1){
      if (clickableGaps){ const marked = state.flow.reading.marks[i] ? " marked" : ""; out += `<span class="word-gap${marked}" data-gap="${i}"><i class="gap-bar"></i></span>`; }
      else out += " ";
    }
  });
  return out;
}
// 코칭 선생님용 — 학생이 표시한 끊어읽기를 그대로 재현하는 읽기 전용 버전
function markedPassageHTML(textId, marks){
  const td = TEXTS[textId];
  if (!td) return "";
  const words = td.passage.split(" ");
  let out = "";
  words.forEach((w,i) => {
    out += esc(w);
    if (i < words.length - 1){
      const marked = marks && marks[i] ? " marked" : "";
      out += `<span class="word-gap static${marked}"><i class="gap-bar"></i></span>`;
    }
  });
  return out;
}

function renderQuiz(){
  const td = currentTextData(); const QUIZ = td.quiz;
  const s = state.flow.quiz;
  if (s.finished){
    markDone(1);
    const rate = Math.round((s.correctCount/QUIZ.length)*100);
    return `<h2 class="step-title">독서 퀴즈 결과</h2><p class="step-desc">5문제 중 ${s.correctCount}개를 맞혔습니다.</p>
      <div class="grid grid-2" style="max-width:320px;">${stat("정답률",rate+"%")}${stat("맞힌 문제",s.correctCount+"/"+QUIZ.length)}</div>
      <div class="ai-box"><span class="tag">AI 약점분석</span><br/>${rate>=80?"전반적으로 잘 이해했습니다. 다음 단계로 넘어가도 좋아요.":"본문의 핵심 인과 관계를 다시 짚어볼 필요가 있습니다. STEP4 '사고의 계단'에서 다시 확인해보세요."}</div>`;
  }
  const q = QUIZ[s.i];
  let optsHTML = "";
  if (q.type === "mc") optsHTML = `<div class="qa-opts">${q.opts.map(o=>{ let cls="qa-opt"; if(s.checked){ if(o===q.answer) cls+=" correct"; else if(o===s.picked) cls+=" wrong"; } return `<button class="${cls}" data-opt="${esc(o)}" ${s.checked?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>`;
  else if (q.type === "ox") optsHTML = ["O","X"].map(o=>{ let cls="qa-opt ox"; if(s.checked){ if(o===q.answer) cls+=" correct"; else if(o===s.picked) cls+=" wrong"; } return `<button class="${cls}" data-opt="${o}" ${s.checked?"disabled":""}>${o}</button>`; }).join("");
  else if (q.type === "short") optsHTML = `<div class="qa-input-row"><input type="text" id="shortInput" placeholder="답을 입력하세요" value="${esc(s.typed||"")}" ${s.checked?"disabled":""}/>${!s.checked?`<button class="btn" id="shortSubmit">확인</button>`:""}</div>`;
  const fb = s.checked ? `<div class="qa-feedback">${s.isCorrect?q.fb.correct:q.fb.wrong}</div>` : "";
  const nextBtn = s.checked ? `<button class="btn" id="quizNext" style="margin-top:12px;">${s.i===QUIZ.length-1?"결과 보기":"다음 문제"}</button>` : "";
  return `<h2 class="step-title">독서 퀴즈</h2><p class="step-desc">본문을 얼마나 이해했는지 5문제로 확인합니다.</p>
    <div class="qa-card"><div class="qa-num">문제 ${s.i+1} / ${QUIZ.length}</div><div class="qa-q">${q.q}</div>${optsHTML}${fb}${nextBtn}</div>`;
}
function bindQuiz(){
  const td = currentTextData(); const QUIZ = td.quiz;
  const s = state.flow.quiz; const q = QUIZ[s.i];
  document.querySelectorAll("[data-opt]").forEach(el => el.addEventListener("click", () => {
    s.picked = el.dataset.opt; s.checked = true; s.isCorrect = s.picked === q.answer; if (s.isCorrect) s.correctCount++;
    s.answers.push({ q: q.q, picked: s.picked, correct: s.isCorrect });
    render();
  }));
  const shortSubmit = document.getElementById("shortSubmit");
  if (shortSubmit) shortSubmit.addEventListener("click", () => {
    const val = document.getElementById("shortInput").value.trim(); s.typed = val; s.checked = true;
    s.isCorrect = q.answer.some(a => a.toLowerCase() === val.toLowerCase()); if (s.isCorrect) s.correctCount++;
    s.answers.push({ q: q.q, picked: val, correct: s.isCorrect });
    render();
  });
  const nextBtn = document.getElementById("quizNext");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    if (s.i === QUIZ.length-1) s.finished = true; else { s.i++; s.picked=null; s.checked=false; s.typed=""; }
    render();
  });
}

function autoComputeEdges(textId, selected){
  const td = TEXTS[textId];
  const relevantSet = new Set(td.keyTerms);
  const added = new Set();
  const edges = [];
  function addEdge(a,b,type,curve,weak){
    const i = selected.indexOf(a), j = selected.indexOf(b);
    if (i<0 || j<0 || i===j) return;
    const key = Math.min(i,j) + "-" + Math.max(i,j);
    if (added.has(key)) return;
    added.add(key);
    edges.push({ from:i, to:j, type, curve, weak: !!weak });
  }
  // 1) 큐레이션된 관계 중 두 단어 모두 선택된 경우 — AI가 근거를 갖고 판단한 관계
  (RELATIONS[textId] || []).forEach(([a,b,type,curve]) => addEdge(a,b,type,curve,false));
  // 2) 아직 연결되지 않은 핵심 단어들은 본문 흐름 순서대로 이어 인과·순차 관계로 보완
  const relevantSelected = td.keyTerms.filter(w => selected.includes(w));
  for (let i=0;i<relevantSelected.length-1;i++) addEdge(relevantSelected[i], relevantSelected[i+1], "arrow", false, false);
  // 3) 이 글과 관련이 낮은 단어는 가장 가까운 핵심 단어에 약한(옅은 점선) 관계로만 표시
  selected.filter(w => !relevantSet.has(w)).forEach(w => {
    const target = relevantSelected[0] || selected.find(x => x !== w);
    if (target) addEdge(w, target, "line", true, true);
  });
  return edges;
}

function seededShuffle(arr, seedStr){
  let seed = 0;
  for (let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    seed = (seed*1103515245 + 12345) >>> 0;
    const j = seed % (i+1);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildWordBank(textId){
  const td = TEXTS[textId];
  const relevant = td.keyTerms.slice();
  let pool = [];
  Object.keys(TEXTS).forEach(id => { if (id !== textId) pool = pool.concat(TEXTS[id].keyTerms); });
  const irrelevant = seededShuffle(pool, textId + "-pool").slice(0,6);
  const bank = relevant.map(w=>({word:w, relevant:true})).concat(irrelevant.map(w=>({word:w, relevant:false})));
  return seededShuffle(bank, textId + "-bank");
}
function computePolygonPositions(n){
  const cx=260, cy=230;
  if (n < 2) return [];
  if (n === 2) return [{x:110,y:230},{x:410,y:230}];
  const r = n<=4 ? 130 : n<=6 ? 150 : n<=9 ? 168 : 185;
  const pts = [];
  for (let i=0;i<n;i++){
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    pts.push({ x: Math.round(cx + r*Math.cos(angle)), y: Math.round(cy + r*Math.sin(angle)) });
  }
  return pts;
}
function computeCurveControlPoint(p1,p2,cx,cy){
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  let dx=mx-cx, dy=my-cy;
  let dist=Math.sqrt(dx*dx+dy*dy);
  if (dist<1){ dx=0; dy=-1; dist=1; }
  const offset=30;
  return { x: mx+(dx/dist)*offset, y: my+(dy/dist)*offset };
}
// 단어 배지(사각형)를 타원으로 근사해, 선이 배지 경계 바로 바깥에서 시작·끝나도록 잘라낸다 — 화살표가 글자에 가려지지 않게.
function trimToward(px,py,qx,qy,rx,ry,maxS){
  const dx=qx-px, dy=qy-py;
  const denom = Math.sqrt((dx*dx)/(rx*rx) + (dy*dy)/(ry*ry));
  let s = denom===0 ? 0 : 1/denom;
  s = Math.min(s, maxS===undefined?1:maxS);
  return { x: px+dx*s, y: py+dy*s };
}
function edgePathD(p1,p2,curve,cx,cy){
  const q = curve ? computeCurveControlPoint(p1,p2,cx,cy) : { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 };
  const BADGE_RX = 58, BADGE_RY = 19; // 배지(108x30)보다 살짝 여유를 둔 타원 반지름
  const t1 = trimToward(p1.x,p1.y,q.x,q.y,BADGE_RX,BADGE_RY,0.42);
  const t2 = trimToward(p2.x,p2.y,q.x,q.y,BADGE_RX,BADGE_RY,0.42);
  if (!curve) return `M${t1.x},${t1.y} L${t2.x},${t2.y}`;
  return `M${t1.x},${t1.y} Q${q.x},${q.y} ${t2.x},${t2.y}`;
}
function diagramFeedback(selected, bank){
  const relevantSet = new Set(bank.filter(b=>b.relevant).map(b=>b.word));
  const chosenRelevant = selected.filter(w=>relevantSet.has(w));
  const chosenIrrelevant = selected.filter(w=>!relevantSet.has(w));
  let score = chosenRelevant.length*14 - chosenIrrelevant.length*12;
  score = Math.max(10, Math.min(100, score));
  let text = chosenIrrelevant.length===0
    ? "선택한 단어가 모두 이 글의 핵심과 관련이 있습니다. "
    : `이 글과 관련이 적은 단어가 섞여 있어요 — <b>${chosenIrrelevant.join(", ")}</b>. 본문을 다시 살펴보고 관련 없는 단어는 빼보세요. `;
  text += "화살표의 방향과 종류(선/화살표/양방향)가 실제 의미 관계와 맞는지도 한 번 더 확인해보세요.";
  return { score, text };
}

/* ---------- STEP 8 : 질문과 대화 (소크라테스식 문답법) ---------- */
const SOCRATIC_MIC_TEMPLATES = [
  "왜 이런 일이 일어났는지 궁금해요.",
  "이 부분이랑 비슷한 다른 예시가 있을까요?",
  "저자는 왜 이렇게 생각했을까요?",
  "만약 다르게 됐다면 어떻게 됐을까요?",
];
function socraticTerms(td, turnIndex){
  const terms = td.keyTerms;
  return [terms[turnIndex % terms.length], terms[(turnIndex+1) % terms.length]];
}
// AI 선생님의 답변 — 본문 핵심어를 근거로 5문장 이내로 구성
function generateSocraticAnswer(td, turnIndex){
  const [c1,c2] = socraticTerms(td, turnIndex);
  const pool = [
    `좋은 질문이에요. ${c1}은(는) 이 글에서 핵심적인 역할을 해요.`,
    `본문에서는 ${c1}이(가) ${c2}로 이어지는 흐름을 보여주고 있어요.`,
    `저자는 ${c1}을(를) 통해 자신의 생각을 구체적으로 드러내고 있답니다.`,
    `이 질문에 답하려면 먼저 ${c1}의 의미를 다시 살펴볼 필요가 있어요.`,
  ];
  return pool.join(" ");
}
// 사고를 확장시키는 후속 질문 — 2~3문장
function generateSocraticExtension(td, turnIndex){
  const [c1,c2] = socraticTerms(td, turnIndex+1);
  const pool = [
    `그렇다면 ${c1}이(가) 없었다면 어떤 일이 벌어졌을까요? 다른 가능성도 한번 생각해보세요.`,
    `${c1}과(와) ${c2}는 서로 어떤 관계가 있을까요? 두 개념을 비교해서 설명해볼 수 있을까요?`,
    `만약 저자가 ${c1}에 대해 반대 입장이었다면 이 글은 어떻게 달라졌을까요?`,
    `우리 주변에서 ${c1}과 비슷한 사례를 찾을 수 있을까요? 왜 그렇게 생각하는지도 함께 말해보세요.`,
  ];
  const idx = turnIndex % pool.length;
  return pool[idx] + (idx%2===0 ? " 다음 질문을 이어서 던져볼까요?" : "");
}
function summarizeSocratic(s, td){
  const qCount = s.messages.filter(m=>m.role==="student").length;
  const score = Math.min(96, 60 + qCount*9);
  const overview = `총 ${qCount}번의 질문을 통해 AI 선생님과 대화를 나눴습니다. 질문들은 '${td.subtitle}'의 핵심 내용과 맞닿아 있었고, 스스로 답을 찾아가는 과정을 보여주었습니다.`;
  const qualityComment = qCount>=3
    ? "질문이 점점 더 깊어지는 모습이 좋았습니다 — 단순한 사실 확인을 넘어 '왜', '어떻게'를 묻는 질문으로 발전했어요."
    : "질문을 몇 개 더 이어가면 사고를 더 확장할 수 있어요. '왜 그럴까?', '다르게 생각하면 어떨까?' 같은 질문을 시도해보세요.";
  return { qCount, score, overview, qualityComment };
}

    ${chatHTML}

function computeOverallScore(){
  const td = currentTextData();
  const f = state.flow;
  const quizPct = Math.round((f.quiz.correctCount / td.quiz.length) * 100);
  const compPct = Math.round((f.comprehension.correctCount / td.comprehension.length) * 100);
  const speechAvg = Math.round(SPEECH_ITEMS.reduce((a,[,v])=>a+v,0) / SPEECH_ITEMS.length);
  const diagramScore = f.diagram.rendered ? diagramFeedback(f.diagram.selected, buildWordBank(f.textId)).score : 0;
  const readingScore = f.reading.evaluated ? 88 : 0;
  const sentenceScore = f.sentence.correct ? 100 : (f.sentence.checked ? 40 : 0);
  const ladderScore = f.ladder.coached ? 80 : 0;
  const socraticScore = f.socratic.finished && f.socratic.evaluation ? f.socratic.evaluation.score : 0;
  const vals = [quizPct, readingScore, sentenceScore, ladderScore, diagramScore, compPct, speechAvg, socraticScore];
  const overall = Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
  return { quizPct, readingScore, sentenceScore, ladderScore, diagramScore, compPct, speechAvg, socraticScore, overall };
}

    background: "15~17세기 · 대서양 무역 · 초기 세계화",

};
// 글자 수에 따라 박스 높이 · 글자 크기가 자연스럽게 늘어나도록 계산
function fitBox(text, width, minH, baseFont){
  const charsPerLine = Math.max(4, Math.floor(width / (baseFont*0.92)));
  const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
  const lineH = baseFont + 6;
  const height = Math.max(minH, 30 + lines*lineH);
  const fontSize = lines >= 4 ? baseFont-1.5 : lines >= 3 ? baseFont-1 : baseFont;
  return { height, fontSize, lines };
}
function renderMasterDiagramSVG(bookId){
  const md = MASTER_DIAGRAM[bookId];
  const bg = md.background;
  const nodeX = [110, 340, 570];
  const nodeY = 55;
  const hubX=340, hubY=230, hubW=224;
  const hubFit = fitBox(md.centralTheme, hubW-32, 88, 12.5);
  const hubH = hubFit.height;
  const boxAX=30, boxBX=360, boxW=290;
  const boxAFit = fitBox(md.authorStance, boxW-28, 92, 11.5);
  const boxBFit = fitBox(bg, boxW-28, 92, 11.5);
  const boxY = hubY + hubH/2 + 76;
  const boxH = Math.max(boxAFit.height, boxBFit.height);
  const svgH = boxY + boxH + 30;
  function fo(x,y,w,h,cls,inner){
    return `<foreignObject x="${x}" y="${y}" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" class="${cls}">${inner}</div></foreignObject>`;
  }
  let nodes = "";
  md.arc.forEach((txt,i) => {
    const nf = fitBox(txt, 160, 62, 11);
    nodes += fo(nodeX[i]-88, nodeY-(nf.height/2), 176, nf.height, "md-node", `<b>${i+1}편</b><div style="font-size:${nf.fontSize}px;">${esc(txt)}</div>`);
  });
  let lines = "";
  for (let i=0;i<2;i++) lines += `<line x1="${nodeX[i]+88}" y1="${nodeY+3}" x2="${nodeX[i+1]-88}" y2="${nodeY+3}" stroke="#3F5B4E" stroke-width="2" marker-end="url(#mdArrow)"/>`;
  nodeX.forEach(x => {
    const hx = hubX + (x<hubX ? -46 : x>hubX ? 46 : 0);
    lines += `<line x1="${x}" y1="${nodeY+36}" x2="${hx}" y2="${hubY-hubH/2}" stroke="#D8D9CE" stroke-width="1.6" stroke-dasharray="3 4"/>`;
  });
  lines += `<line x1="${hubX-44}" y1="${hubY+hubH/2}" x2="${boxAX+boxW/2}" y2="${boxY}" stroke="#3F5B4E" stroke-width="1.8"/>`;
  lines += `<line x1="${hubX+44}" y1="${hubY+hubH/2}" x2="${boxBX+boxW/2}" y2="${boxY}" stroke="#3F5B4E" stroke-width="1.8"/>`;
  const hub = fo(hubX-hubW/2, hubY-hubH/2, hubW, hubH, "md-hub", `<b>이 책의 중심 주제</b><div style="font-size:${hubFit.fontSize}px;">${esc(md.centralTheme)}</div>`);
  const boxA = fo(boxAX, boxY, boxW, boxAFit.height, "md-side", `<b>✍️ 저자의 관점·의도</b><div style="font-size:${boxAFit.fontSize}px;">${esc(md.authorStance)}</div>`);
  const boxB = fo(boxBX, boxY, boxW, boxBFit.height, "md-side", `<b>🌍 시대·공간·사상적 배경</b><div style="font-size:${boxBFit.fontSize}px;">${esc(bg)}</div>`);
  return `<svg class="tree-svg" viewBox="0 0 680 ${svgH}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="mdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#3F5B4E"/></marker></defs>
    ${lines}
    ${nodes}
    ${hub}
    ${boxA}
    ${boxB}
  </svg>`;
}

  return `

    </div>

    <div class="staircase-wrap" style="margin-top:16px;">
      <div class="staircase-title">📘 ${book.title} · 전체 구조 — AI가 정리한 모범 다이어그램</div>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;">지금까지 STEP5에서 그린 다이어그램은 나만의 훈련용이었다면, 이건 이 책 전체의 중심 내용·저자의 관점·시대적 배경을 한 번에 정리한 모범 구조예요. 내가 그린 다이어그램과 비교해보세요.</div>
      ${renderMasterDiagramSVG(book.id)}

    <div class="ai-box"><span class="tag">AI 총평</span><br/>
      전체적으로 본문의 핵심 흐름을 잘 따라갔습니다. 스피치의 핵심어 사용과 사고의 계단에서 배경 서술을 더 보완하면 다음 글에서 더 높은 점수를 받을 수 있어요.</div>
    <div style="margin-top:18px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="reportNext">${isLastText ? "학생 홈으로 →" : "다음 텍스트로 진행 →"}</button>
      <button class="btn ghost" id="toBookDetail">책 상세로 돌아가기</button>

function bindReport(){
  const f = state.flow;
  const td = currentTextData();
  const r = computeOverallScore();
  const book = findBook(f.bookId);
  const textIndex = book.texts.findIndex(t => t.id === f.textId);
  const isLastText = textIndex === book.texts.length - 1;

  document.getElementById("reportNext").addEventListener("click", () => {
    // 교사/학부모 화면이 그대로 읽어가는 실제 기록
    state.activity.records.push({
      bookId: f.bookId, textId: f.textId, bookTitle: book.title, subtitle: td.subtitle, overall: r.overall,
      quizPct: r.quizPct, readingScore: r.readingScore, sentenceScore: r.sentenceScore,
      ladderScore: r.ladderScore, diagramScore: r.diagramScore, compPct: r.compPct, speechAvg: r.speechAvg,
      socraticScore: r.socraticScore, socraticQuestionCount: f.socratic.evaluation ? f.socratic.evaluation.qCount : 0,
      readingMarks: { ...f.reading.marks },
      readingMarkedCount: Object.values(f.reading.marks).filter(Boolean).length,
      quizAnswers: f.quiz.answers.slice(),
      sentenceAnswer: { text: td.sentence.text, picked: f.sentence.mode==="guided" ? f.sentence.picked : f.sentence.typed, correct: f.sentence.correct, mode: f.sentence.mode },
      ladderAnswers: { d1: f.ladder.d1, d2: f.ladder.d2, d3: f.ladder.d3, gradeMode: f.ladder.gradeMode },
      diagramSelected: f.diagram.selected.slice(),
      diagramRendered: f.diagram.rendered,
      comprehensionAnswers: f.comprehension.answers.slice(),
      speechTranscript: getSpeechTranscript(td),
      completedAt: Date.now(),
    });
    state.activity.todayMinutes += 14 + Math.floor(Math.random()*6);
    awardPoints(20 + Math.round(r.overall/4) + (isLastText ? 100 : 0));

    book.texts[textIndex].status = "complete";
    if (!isLastText){
      book.texts[textIndex+1].status = "progress";
      launchFlow(book.id, book.texts[textIndex+1].id);
      return;
    }
    // 책 완료 → 다음 책 잠금 해제
    book.status = "complete";
    const nextBook = state.books[state.books.findIndex(b=>b.id===book.id)+1];
    if (nextBook){ nextBook.status = "progress"; nextBook.texts[0].status = "progress"; }
    state.view = "shell"; state.role = "student"; state.nav = "home";
    if (!state.visited.student) state.visited.student = {};
    state.visited.student["home"] = true;
    render();
  });
  document.getElementById("toBookDetail").addEventListener("click", () => { state.view = "book"; state.activeBookId = f.bookId; render(); });
}

const FLOW_STEPS = [
  { id:1, label:"독서 퀴즈" }, { id:2, label:"읽기 훈련" }, { id:3, label:"문장 이해" },
  { id:4, label:"사고의 계단" }, { id:5, label:"다이어그램" }, { id:6, label:"독해 문제" }, { id:7, label:"스피치" },
  { id:8, label:"질문과 대화" },
];
const FLOW_RENDERERS = { 1:renderQuiz, 2:renderReading, 3:renderSentence, 4:renderLadder, 5:renderDiagram, 6:renderComprehension, 7:renderSpeech, 8:renderSocratic, 9:renderReport };
const FLOW_BINDERS = { 1:bindQuiz, 2:bindReading, 3:bindSentence, 4:bindLadder, 5:bindDiagram, 6:bindComprehension, 7:bindSpeech, 8:bindSocratic, 9:bindReport };

function exitFlow(){
  if (state.flow && state.flow.speech.timer) clearInterval(state.flow.speech.timer);
  if (state.flow && state.flow.socratic && state.flow.socratic.timer) clearInterval(state.flow.socratic.timer);
  state.view = "book"; render();
}

// 엘리먼트를 드래그로 자유롭게 옮길 수 있게 만든다. 움직이지 않고 뗀 경우(=클릭)에는 onClick을 대신 실행한다.
function makeDraggable(handleEl, moveEl, containerEl, posState, onClick){
  let startX=0, startY=0, startLeft=0, startTop=0, dragging=false, moved=false;
  function onMove(e){
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    e.preventDefault();
    const cRect = containerEl.getBoundingClientRect();
    let left = Math.max(4, Math.min(startLeft+dx, cRect.width - moveEl.offsetWidth - 4));
    let top = Math.max(4, Math.min(startTop+dy, cRect.height - moveEl.offsetHeight - 4));
    moveEl.style.left = left+"px"; moveEl.style.top = top+"px";
    moveEl.style.right = "auto"; moveEl.style.bottom = "auto";
  }
  function onUp(){
    dragging = false;
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.removeEventListener("touchmove", onMove);
    document.removeEventListener("touchend", onUp);
    if (moved){
      posState.left = parseFloat(moveEl.style.left);
      posState.top = parseFloat(moveEl.style.top);
    } else if (onClick){
      onClick();
    }
  }
  function onDown(e){
    const p = e.touches ? e.touches[0] : e;
    dragging = true; moved = false;
    const mRect = moveEl.getBoundingClientRect(), cRect = containerEl.getBoundingClientRect();
    startLeft = mRect.left - cRect.left; startTop = mRect.top - cRect.top;
    startX = p.clientX; startY = p.clientY;
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchmove", onMove, { passive:false });
    document.addEventListener("touchend", onUp);
  }
  handleEl.addEventListener("mousedown", onDown);
  handleEl.addEventListener("touchstart", onDown, { passive:true });
}
function applySavedPos(el, pos){
  if (!pos || pos.left === undefined) return;
  el.style.left = pos.left+"px"; el.style.top = pos.top+"px";
  el.style.right = "auto"; el.style.bottom = "auto";
}
function renderFlow(){
  const root = document.getElementById("root");
  const f = state.flow;
  const td = currentTextData();
  const book = findBook(f.bookId);
  const isReport = f.step === 9;
  const tracker = FLOW_STEPS.map(st => {
    const cls = !isReport && st.id === f.step ? "current" : f.done[st.id] ? "done" : "";
    return `<button class="tstep ${cls}" data-jump="${st.id}"><span class="circ">${f.done[st.id] && st.id!==f.step ? "✓" : st.id}</span><span class="tlabel">${st.label}</span></button>`;
  }).join("");

  const cp = chatParticipants();
  const unread = chatUnreadCount("student");
  const chatFab = `<button type="button" class="chat-fab" id="chatFabBtn" title="코칭 선생님에게 실시간으로 도움 요청하기">💬${unread>0?`<span class="chat-fab-badge">${unread}</span>`:""}</button>`;
  const classroomFab = (state.classroomShare.type && state.classroomUnseen)
    ? `<button type="button" class="classroom-fab" id="classroomFabBtn" title="선생님이 자료를 공유했어요">📺<span class="chat-fab-badge">N</span></button>`
    : "";
  const chatOverlay = state.chatOverlayOpen ? `
    <div class="chat-overlay">
      <div class="chat-overlay-head">
        <span>${cp.teacher.icon} ${esc(cp.teacher.name)} · ${cp.teacher.role}에게 실시간 질문</span>
        <button type="button" class="chat-overlay-close" id="chatOverlayClose">✕</button>
      </div>
      <div class="chat-body" id="chatMessages" style="max-height:220px;">${renderChatMessages("student", cp, state.chat)}</div>
      <div class="chat-emoji-row">${CHAT_EMOJIS.map(e=>`<button type="button" class="chat-emoji-btn" data-emoji="${e}">${e}</button>`).join("")}</div>
      <div class="chat-input-row">
        <input class="login-input" id="chatInput" placeholder="궁금한 점을 바로 물어보세요" value="${esc(state.chat.draft)}"/>
        <button class="btn" id="chatSend">보내기</button>
      </div>
    </div>` : "";

  root.innerHTML = `
    <div class="flow-wrap">
      <div class="flow-head">
        <span class="wordmark"><span class="dot"></span>B180 · OS</span>
        <button class="flow-exit" id="exitFlow">← 책 상세로 나가기</button>
      </div>
      <div style="padding: 4px 26px 0; font-size:12px; color:var(--ink-soft);">학생 &nbsp;/&nbsp; ${book.title} &nbsp;/&nbsp; <b style="color:var(--ink)">${td.subtitle}</b> &nbsp;/&nbsp; ${isReport ? "완료 리포트" : "STEP"+f.step+" · "+FLOW_STEPS[f.step-1].label}</div>
      <div style="padding: 6px 26px 0;">${classSessionBannerHTML()}</div>
      <div class="tracker">${tracker}</div>
      <div class="flow-body">${FLOW_RENDERERS[isReport?9:f.step]()}</div>
      ${!isReport ? `
      <div class="flow-foot">
        <span class="done-badge">${Object.keys(f.done).length}/8 단계 완료</span>
        <div class="nav-btns">
          <button class="btn ghost" id="prevBtn" ${f.step===1?"disabled":""}>← 이전</button>
          <button class="btn" id="nextBtn">${f.step===8 ? "완료 리포트 보기 →" : "다음 →"}</button>
        </div>
      </div>` : ""}
      ${chatFab}
      ${classroomFab}
      ${chatOverlay}
    </div>`;

  FLOW_BINDERS[isReport?9:f.step]();
  document.getElementById("exitFlow").addEventListener("click", exitFlow);
  root.querySelectorAll("[data-jump]").forEach(el => el.addEventListener("click", () => { f.step = Number(el.dataset.jump); render(); }));
  const prev = document.getElementById("prevBtn"); if (prev) prev.addEventListener("click", () => { if (f.step>1){ f.step--; render(); } });
  const next = document.getElementById("nextBtn"); if (next) next.addEventListener("click", () => { if (f.step<8){ f.step++; } else { f.step=9; } render(); });
  const closeBtn = document.getElementById("chatOverlayClose");
  if (closeBtn) closeBtn.addEventListener("click", () => { state.chatOverlayOpen = false; render(); });
  if (state.chatOverlayOpen) bindChat();
  const classroomFabBtn = document.getElementById("classroomFabBtn");
  if (classroomFabBtn) classroomFabBtn.addEventListener("click", () => {
    state.classroomUnseen = false; state.view = "shell"; state.role = "student"; state.nav = "classroom";
    if (!state.visited.student) state.visited.student = {}; state.visited.student["classroom"] = true;
    render();
  });

  const flowWrapEl = root.querySelector(".flow-wrap");
  const fabEl = document.getElementById("chatFabBtn");
  if (fabEl){
    applySavedPos(fabEl, state.chatFabPos);
    makeDraggable(fabEl, fabEl, flowWrapEl, state.chatFabPos || (state.chatFabPos = {}), () => { state.chatOverlayOpen = !state.chatOverlayOpen; render(); });
  }
  const overlayEl = root.querySelector(".chat-overlay");
  const overlayHeadEl = root.querySelector(".chat-overlay-head");
  if (overlayEl && overlayHeadEl){
    applySavedPos(overlayEl, state.chatOverlayPos);
    makeDraggable(overlayHeadEl, overlayEl, flowWrapEl, state.chatOverlayPos || (state.chatOverlayPos = {}), null);
  }
}

/* =========================== 조립 =========================== */
let lastScreenKey = "";
function currentScrollEl(){
  return document.querySelector("#root .canvas") || document.querySelector("#root .flow-body");
}
function currentScreenKey(){
  return [
    state.view, state.role, state.nav,
    state.view === "flow" && state.flow ? state.flow.step : "",
    (state.view === "book" || state.view === "bookintro") ? state.activeBookId : "",
  ].join("|");
}
function render(){
  const key = currentScreenKey();
  const sameScreen = key === lastScreenKey;
  const prevScrollEl = sameScreen ? currentScrollEl() : null;
  const scrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;

  if (state.view === "gate") renderGate();
  else if (state.view === "login") renderLogin();
  else if (state.view === "shell") renderShell();
  else if (state.view === "bookintro") renderBookIntro();
  else if (state.view === "book") renderBookDetail();
  else renderFlow();

  if (sameScreen){
    const newScrollEl = currentScrollEl();
    if (newScrollEl) newScrollEl.scrollTop = scrollTop;
  }
  lastScreenKey = key;
}
render();
