name: HIGO 주간 자동 갱신

# 매주 한 번 Claude 조사 에이전트가 공백 분석 상위 작업을 조사하고,
# 원문 대조·위험도 정책·품질 기준을 통과한 변경을 PR 로 올린다. 사람은 PR 을 확인하고 병합만 한다.
on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 (한국 시간) = 일요일 18:00 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "주기당 API 비용 상한 (달러)"
        default: "5"
      max_tasks:
        description: "한 주기에 조사할 최대 작업 수"
        default: "8"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: higo-weekly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install anthropic

      - name: 단위 테스트 (API 비용을 쓰기 전에 코드 상태 확인)
        working-directory: higo
        run: python -m unittest discover -s tests

      - name: 조사 → 독립 검토 → 원문 대조 → 위험도 정책 → 보고서
        id: cycle
        working-directory: higo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.budget || '5' }}
          MAX_TASKS: ${{ inputs.max_tasks || '8' }}
        run: |
          set +e
          python -m higo research --budget "$BUDGET" --max-tasks "$MAX_TASKS" --report "$RUNNER_TEMP/report.md" > /dev/null
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: higo-report
          path: ${{ runner.temp }}/report.md
          if-no-files-found: ignore

      - name: PR 열기
        if: steps.cycle.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain higo/data)" ]; then echo "변경 사항 없음"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          branch="higo/weekly-${day}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add higo/data
          git commit -m "HIGO 주간 자동 갱신 ${day}"
          git push origin "$branch"
          head -c 60000 "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/body.md"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "HIGO 주간 자동 갱신 ${day}" --body-file "$RUNNER_TEMP/body.md"

      - name: 품질 기준·스키마 검사 실패 시 알림
        if: steps.cycle.outputs.code != '0'
        run: |
          echo "::error::품질 기준 점수 하락 또는 스키마 오류로 이번 주기의 변경을 반영하지 않았습니다. 보고서 아티팩트를 확인하세요."
          exit 1
